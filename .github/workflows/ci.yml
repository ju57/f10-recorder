name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-ubuntu:
    name: Core checks (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore projects/F10Recorder.CoreChecks/F10Recorder.CoreChecks.csproj --locked-mode
      - name: Run portable core checks
        run: dotnet run --project projects/F10Recorder.CoreChecks/F10Recorder.CoreChecks.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -- artifacts/core-checks-ci

  windows-build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies
        run: dotnet restore projects/F10Recorder.Desktop/F10Recorder.Desktop.csproj --locked-mode
      - name: Build Avalonia app
        run: dotnet build projects/F10Recorder.Desktop/F10Recorder.Desktop.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Restore locked worker checks
        run: dotnet restore projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj --locked-mode
      - name: Build worker checks
        run: dotnet build projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Restore locked offscreen entry checks
        run: dotnet restore projects/F10Recorder.MigrationTests/F10Recorder.MigrationTests.csproj --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build offscreen entry checks
        run: dotnet build projects/F10Recorder.MigrationTests/F10Recorder.MigrationTests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Verify profile entry without native windows or capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $output = Join-Path 'artifacts' ('profile-entry-ci-' + [guid]::NewGuid().ToString('N'))
          dotnet run --project projects/F10Recorder.MigrationTests/F10Recorder.MigrationTests.csproj -c Release --no-build -- "$output/normal" --profile-entry-ui
          $normalExit = $LASTEXITCODE
          ./tests/verify-profile-entry-report.ps1 -ReportPath "$output/normal/verification.json" -RunExitCode $normalExit -Mode Normal
          dotnet run --project projects/F10Recorder.MigrationTests/F10Recorder.MigrationTests.csproj -c Release --no-build -- "$output/sensitivity" --profile-entry-ui --sensitivity-control
          $controlExit = $LASTEXITCODE
          ./tests/verify-profile-entry-report.ps1 -ReportPath "$output/sensitivity/verification.json" -RunExitCode $controlExit -Mode Sensitivity
          exit 0
      - name: Verify Storage controls without capture or GPU
        run: dotnet run --project projects/F10Recorder.MigrationTests/F10Recorder.MigrationTests.csproj -c Release --no-build -- artifacts/storage-controls-ci --storage-controls-ui
      - name: Verify replay ownership without capture or GPU
        shell: pwsh
        run: |
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-ownership artifacts/replay-ownership-ci
          $code = $LASTEXITCODE
          if ($code) {
            $report = Get-Content artifacts/replay-ownership-ci/verification.json -Raw | ConvertFrom-Json
            $report.checks | Where-Object result -ne 'passed' | ConvertTo-Json -Depth 8
          }
          exit $code
      - name: Verify coordinated completed-segment publication without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-manifest-stream artifacts/replay-manifest-ci
      - name: Verify supplied replay output reservations without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-output-validation artifacts/replay-output-ci
      - name: Verify sampler and atomic storage claims without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-publication-checks artifacts/replay-publication-ci
      - name: Verify frozen calibration resource admission without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-foreground-checks artifacts/replay-resource-ci
      - name: Verify independent capture closure evidence without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-capture-evidence-checks artifacts/replay-capture-evidence-ci
      - name: Verify calibration startup diagnostics without media or power effects
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-startup-checks artifacts/replay-startup-ci
      - name: Verify cross-process fixture readiness publication without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-fixture-publication-checks artifacts/replay-fixture-publication-ci
      - name: Verify manifest observation races without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-storage-races artifacts/replay-storage-races-ci
      - name: Verify snapshot evidence archive without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-archive-checks artifacts/replay-archive-ci
      - name: Verify sampler timing without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-timing-checks artifacts/replay-sampler-timing-ci
      - name: Verify reference output estimate arithmetic without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-model-checks artifacts/replay-model-ci
      - name: Verify qualified reference catalog with controlled host metadata
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-catalog-checks artifacts/replay-catalog-ci
      - name: Verify shared volume reservations without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-volume-reservations artifacts/replay-volume-ci
      - name: Verify accepted replay and capture ledger contention without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-storage-contention artifacts/replay-contention-ci
      - name: Verify active and offline storage phases without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-calibration-phase-checks artifacts/replay-phases-ci
      - name: Verify durable storage holds and explicit Resume without media
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-storage-safety artifacts/replay-storage-safety-ci
      - name: Verify capture storage supervision with controlled producers
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-storage-runtime artifacts/replay-storage-runtime-ci
      - name: Verify producer crash recovery without media
        shell: pwsh
        run: |
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --replay-producer-recovery artifacts/replay-producer-recovery-ci
          $code = $LASTEXITCODE
          if ($code) {
            $report = Get-Content artifacts/replay-producer-recovery-ci/producer-recovery.json -Raw | ConvertFrom-Json
            $report.checks | Where-Object { -not $_.passed } | ConvertTo-Json -Depth 8
          }
          exit $code
      - name: Verify capture status without capture or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --capture-status artifacts/capture-status-ci
      - name: Verify bounded profile status without native recorder or GPU
        run: dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --profile-status-transport artifacts/profile-status-transport-ci
      - name: Verify settings acknowledgements without native recorder or GPU
        shell: pwsh
        run: |
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --apply-acknowledgements artifacts/apply-acknowledgements-ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --apply-acknowledgements artifacts/apply-acknowledgements-control-ci --sensitivity-control
          if ($LASTEXITCODE -ne 1) { throw 'Acknowledgement sensitivity control did not fail as expected.' }
          $control = Get-Content artifacts/apply-acknowledgements-control-ci/verification.json -Raw | ConvertFrom-Json
          $unexpected = @($control.checks | Where-Object result -ne 'passed')
          if ($control.result -ne 'failed' -or -not $control.sensitivityControl -or @($control.checks).Count -ne 13 -or $unexpected.Count -ne 1 -or $unexpected[0].name -ne 'unmatched-operation-cannot-report-correction-success') {
            throw 'Acknowledgement sensitivity control failed for an unintended reason.'
          }
          exit 0
      - name: Verify engine capability responses without capture or GPU
        shell: pwsh
        run: |
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --engine-capabilities artifacts/engine-capabilities-ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project projects/F10Recorder.WorkerChecks/F10Recorder.WorkerChecks.csproj -c Release --no-build -- --engine-capabilities artifacts/engine-capabilities-control-ci --sensitivity-control
          if ($LASTEXITCODE -ne 1) { throw 'Capability sensitivity control did not fail as expected.' }
          $control = Get-Content artifacts/engine-capabilities-control-ci/verification.json -Raw | ConvertFrom-Json
          $unexpected = @($control.checks | Where-Object result -ne 'passed')
          if ($control.result -ne 'failed' -or -not $control.sensitivityControl -or @($control.checks).Count -ne 4 -or $unexpected.Count -ne 1 -or $unexpected[0].name -ne 'missing-capability-response-must-reject') {
            throw 'Capability sensitivity control failed for an unintended reason.'
          }
          exit 0
      - name: Verify test launch effects without UI or capture
        shell: pwsh
        run: ./tests/verification-launch-checks.ps1
      - name: Verify experiment admission without capture
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_experiment_contract.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/experiment-runtime-checks.ps1
      - name: Verify pilot preparation without media
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_pilot_collector.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify native pilot storage without capture
        shell: pwsh
        run: |
          ./tests/pilot-storage-launch-checks.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assembly = Join-Path $PWD 'projects/F10Recorder.WorkerChecks/bin/Release/net10.0-windows/F10Recorder.WorkerChecks.dll'
          $assemblySha256 = (Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash
          ./tests/pilot-storage.ps1 -Checks -NoBuild -Sdk (Get-Command dotnet).Source -AssemblyPath $assembly -ExpectedAssemblySha256 $assemblySha256
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify one guarded process stage with tiny nonmedia fixtures
        shell: pwsh
        run: |
          $assembly = Join-Path $PWD 'projects/F10Recorder.WorkerChecks/bin/Release/net10.0-windows/F10Recorder.WorkerChecks.dll'
          $assemblySha256 = (Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash
          ./tests/pilot-storage.ps1 -Plan -ProcessChecks -Sdk (Get-Command dotnet).Source -AssemblyPath $assembly -ExpectedAssemblySha256 $assemblySha256
          ./tests/pilot-storage.ps1 -ProcessChecks -NoBuild -Sdk (Get-Command dotnet).Source -AssemblyPath $assembly -ExpectedAssemblySha256 $assemblySha256
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

# Hardware/UI acceptance is a separate local suite. Hosted runners do not
# establish NVIDIA capture, fullscreen behavior, or driver performance.
